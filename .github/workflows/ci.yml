name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python Swarm & Locust Verification
    runs-on: [self-hosted, linux, x64, hostinger-vps]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit and HTTP integration tests
        run: python3 -m unittest discover -s tests -v

      - name: Smoke test swarm API against a local mock target
        # Offline by default: the driver boots tools/mock_target.py on 127.0.0.1 and points
        # the swarm at it. Ephemeral ports are used, so it cannot collide with the prod
        # swarm service on 4070. Set the repo variable SMOKE_TARGET_HOST to smoke a real
        # environment instead; no external domain is contacted unless it is set.
        env:
          TARGET_HOST: ${{ vars.SMOKE_TARGET_HOST }}
        run: python3 .github/scripts/ci_smoke.py
